name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Run sample CLI pipeline
        run: |
          python -m dialogue_pipeline check \
            --input data/samples/raw_dialogues.jsonl \
            --output artifacts/ci-check
          python -m dialogue_pipeline run \
            --input data/samples/raw_dialogues.jsonl \
            --config configs/default.json \
            --output artifacts/ci-run \
            --db artifacts/ci.sqlite

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
